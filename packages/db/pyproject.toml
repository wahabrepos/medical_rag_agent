[project]
name = "medrag-db"
version = "0.1.0"
description = "PostgreSQL + pgvector schema and sessions."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0.40",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"
