[project]
name = "medrag-ingest"
version = "0.1.0"
description = "Corpus ingestion jobs: load, chunk, embed, index."
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.0",
    "medrag-core",
    "medrag-db",
    "medrag-inference",
    "medrag-search",
    "medrag-settings",
]

[project.scripts]
medrag-ingest = "medrag_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
medrag-core = { workspace = true }
medrag-db = { workspace = true }
medrag-inference = { workspace = true }
medrag-search = { workspace = true }
medrag-settings = { workspace = true }
