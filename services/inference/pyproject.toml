[project]
name = "medrag-inference"
version = "0.1.0"
description = "CPU inference service: BGE embeddings and DeBERTa NLI."
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.34",
    "medrag-settings",
    "numpy>=2.2",
    "onnxruntime>=1.22",
    "tokenizers>=0.21",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
medrag-settings = { workspace = true }
