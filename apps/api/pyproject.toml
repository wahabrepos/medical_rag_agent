[project]
name = "medrag-api"
version = "0.1.0"
description = "FastAPI service exposing the agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116",
    "medrag-agent",
    "medrag-core",
    "medrag-db",
    "medrag-settings",
    "uvicorn>=0.35",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"

[tool.uv.sources]
medrag-agent = { workspace = true }
medrag-core = { workspace = true }
medrag-db = { workspace = true }
medrag-settings = { workspace = true }
